[project]
name = "agenticrl"
version = "0.2.0"
description = "AgenticRL: LLM Agent reinforcement learning framework. Train agents via GRPO (TRL-based) or prompt-level optimization (DSPy-style) in general-purpose environments."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "transformers>=4.45.0",
    "trl>=0.15.0",
    "accelerate>=0.33.0",
    "datasets>=3.0.0",
    "peft>=0.12.0",
    "gymnasium>=1.0.0",
    "pyyaml>=6.0",
    "wandb>=0.18.0",
    "torch>=2.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
